"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 1200
scan_timeout = 30
palette = "catppuccin_mocha"

format = "$os$username$hostname$directory$git_branch$git_status$python$nodejs$rust$golang$conda$line_break$character"
right_format = "$cmd_duration$status$time"

[os]
disabled = false
format = "[$symbol]($style)"
style = "bold sapphire"

[os.symbols]
Macos = " "

[username]
show_always = false
format = "[$user]($style)@"
style_user = "bold blue"
style_root = "bold red"

[hostname]
ssh_only = true
ssh_symbol = " "
format = "[$ssh_symbol$hostname]($style) "
style = "bold yellow"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold lavender"
read_only = " 󰌾"
read_only_style = "red"
truncation_length = 4
truncate_to_repo = false

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Desktop" = " "

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold mauve"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold peach"
conflicted = "= "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
up_to_date = ""
untracked = "?${count} "
stashed = "󰏗 "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[python]
symbol = " "
format = "[${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"
style = "bold yellow"

[nodejs]
symbol = " "
format = "[$symbol($version )]($style)"
style = "bold green"

[rust]
symbol = " "
format = "[$symbol($version )]($style)"
style = "bold peach"

[golang]
symbol = " "
format = "[$symbol($version )]($style)"
style = "bold sapphire"

[conda]
symbol = " "
format = "[$symbol$environment]($style) "
style = "bold green"
ignore_base = true

[cmd_duration]
min_time = 1500
format = "[󰔟 $duration]($style) "
style = "yellow"

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "✘"
success_symbol = ""
style = "bold red"
map_symbol = true

[time]
disabled = false
time_format = "%H:%M"
format = "[ $time]($style)"
style = "overlay1"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
